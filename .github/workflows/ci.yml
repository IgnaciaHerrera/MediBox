name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medibox_test
          POSTGRES_USER: medibox
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medibox -d medibox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://medibox:test-password@localhost:5432/medibox_test
      NODE_ENV: test
    defaults:
      run:
        working-directory: app
    steps:
      # Secretos efímeros: se generan en cada ejecución y nunca quedan
      # escritos en el repositorio, ni siquiera los de prueba.
      - name: Generar secretos de la ejecución
        run: |
          for variable in SESSION_SECRET PACIENTE_IDENTIDAD_KEY PACIENTE_CONTACTO_KEY \
            PACIENTE_CLINICO_KEY PACIENTE_RUT_HMAC_KEY; do
            valor="$(openssl rand -base64 32)"
            echo "::add-mask::$valor"
            echo "$variable=$valor" >> "$GITHUB_ENV"
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx prisma migrate deploy
      - run: npm run seed
      - run: npm test
