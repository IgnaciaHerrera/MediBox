# docker-compose.yml
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    logging: &logs-con-tope
      # Los logs guardan la IP y la ruta de cada petición: se rotan para que
      # no crezcan sin límite (Hito 1 propone 90 días; Docker solo rota por
      # tamaño, así que el tope es de 3 archivos de 10 MB).
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build: ./app
    env_file: .env
    environment:
      TZ: America/Santiago
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    logging: *logs-con-tope

volumes:
  db_data:
