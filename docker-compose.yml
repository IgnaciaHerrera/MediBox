# docker-compose.yml
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    logging: &logs-con-tope
      # Los logs guardan la IP y la ruta de cada petición: se rotan para que
      # no crezcan sin límite (Hito 1 propone 90 días; Docker solo rota por
      # tamaño, así que el tope es de 3 archivos de 10 MB).
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Aplica las migraciones con el dueño de la base (DATABASE_URL de .env) y
  # activa el login del rol medibox_app. Corre una vez y termina: la app no
  # arranca hasta que termine bien.
  migraciones:
    build: ./app
    env_file: .env
    command: ["sh", "-c", "npx prisma migrate deploy && node prisma/rol-app.js"]
    depends_on:
      db:
        condition: service_healthy
    logging: *logs-con-tope

  app:
    build: ./app
    env_file: .env
    environment:
      TZ: America/Santiago
      # La app se conecta con el rol de mínimo privilegio (migración
      # 20261023120000_rol_aplicacion), nunca con el dueño de la base, cuya
      # contraseña no le llega.
      DATABASE_URL: postgresql://medibox_app:${APP_DB_PASSWORD}@db:5432/${DB_NAME}
      DB_PASSWORD: ""
    depends_on:
      migraciones:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    # Archivos que deben vivir fuera de la base y de sus respaldos: la lista de
    # supresiones (se reaplica tras restaurar) y, en desarrollo, la bandeja
    # simulada donde llegan los códigos de verificación.
    volumes:
      - ./registro:/app/registro
    logging: *logs-con-tope

  # Corre los procesos de operación a su hora (app/src/lib/programador.js):
  # revisión de alertas, copia y verificación de la auditoría, plazos de
  # conservación, recordatorios y encuestas. Sin él, esas reglas existen pero
  # nadie las evalúa. Es opcional (perfil `operacion`) porque en desarrollo la
  # app y las pruebas comparten la base y no conviene que corran solos; en
  # producción se activa una vez con COMPOSE_PROFILES=operacion en .env.
  tareas:
    profiles: ["operacion"]
    build: ./app
    env_file: .env
    command: ["node", "src/tareas.js"]
    environment:
      TZ: America/Santiago
      # Igual que la app: el rol de mínimo privilegio, nunca el dueño de la base.
      DATABASE_URL: postgresql://medibox_app:${APP_DB_PASSWORD}@db:5432/${DB_NAME}
      DB_PASSWORD: ""
    depends_on:
      migraciones:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - ./registro:/app/registro
      # La copia externa de la auditoría: AUDITORIA_COPIA_DIR es la ruta de un
      # almacenamiento de otro equipo montado en este servidor, y se monta en el
      # contenedor en la misma ruta. Sin ella, en desarrollo, queda en registro/.
      - ${AUDITORIA_COPIA_DIR:-./registro/auditoria-copia}:${AUDITORIA_COPIA_DIR:-/app/registro/auditoria-copia}
    logging: *logs-con-tope

volumes:
  db_data:
